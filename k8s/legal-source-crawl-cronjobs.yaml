  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flk-law-backfill
        spec:
          restartPolicy: OnFailure
          containers:
            - name: crawler
              image: ccr.ccs.tencentyun.com/lawcraw-business/fd-law-data:sha-28f3334
              imagePullPolicy: IfNotPresent
              env:
                - name: NODE_OPTIONS
                  value: "--max-old-space-size=384"
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.5:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-access-key }
                - name: RUSTFS_SECRET_KEY
                  valueFrom:
                    secretKeyRef: { name: flk-law-crawl-credentials, key: rustfs-secret-key }
                - name: RUSTFS_REGION
                  value: "us-east-1"
                - name: LAWS_BUCKET
                  value: "laws"
                - name: FLK_PAGE_SIZE
                  value: "100"
                - name: FLK_RATE_MS
                  value: "1100"
              command:
                - node
                - bin/flk-crawl.mjs
                - --backfill
                - --batch-days
                - "365"
