# flk-law-embed — laws-export shards -> SiliconFlow embeddings -> Qdrant.
#
# 2026-10-14 incident sync: image moved off the retired Harbor
# (100.64.0.8:30880, decommissioned 2026-10-11) onto ccr, pinned to the same
# anchored tag as the rest of the legal line. No imagePullSecrets: nodes carry
# ccr credentials.
#
# == RESTORED 2026-10-19 (finance-legal-trust-gates §3) ==
# The OPEN note below is closed. Two separate blockers were found and both are
# resolved; neither was the credentials problem the note assumed:
#   1. The secret DOES exist — `flk-embed-credentials` lives in the xinru-master
#      `scraw` namespace (created 2026-09-20), not the tencent one. The key was
#      verified live against SiliconFlow with Qwen/Qwen3-Embedding-0.6B.
#   2. The worker could not start even with a valid key: selfCheck probed a
#      hardcoded shard (`sh2-00000.jsonl`) whose first point (1048576) had been
#      re-chunked away, so every run aborted with a 404 that read like a
#      credentials/collection failure. Fixed in lib/embed/worker.js — the probe
#      now follows the current incr-manifest and walks past dead points.
# Verified end-to-end (Job flk-embed-verify, image sha-9911e78): self-check
# cosine 1.000000, 2 shards / 115 rows embedded, Qdrant 364,801 -> 364,916
# points == law_db.law_chunks_v2 row count (gap closed).
#
# Historical note (kept for the reasoning trail): the live CronJob carries
# EMBED_API_KEY from secret `flk-embed-credentials`; the 10-14 audit looked for
# it in the wrong cluster and left the job suspended on that assumption.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flk-law-embed
  namespace: scraw
  labels:
    app.kubernetes.io/name: flk-law-embed
    app.kubernetes.io/part-of: finddata
spec:
  schedule: "30 5 * * *"       # 05:30 Asia/Shanghai (nodes run Beijing time) — after the 04:30 loader
  # Live since 2026-10-19 (see RESTORED note above).
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flk-law-embed
        spec:
          restartPolicy: OnFailure
          containers:
            - name: embedder
              image: ccr.ccs.tencentyun.com/lawcraw-business/fd-law-data:sha-28f3334
              imagePullPolicy: IfNotPresent
              env:
                - name: RUSTFS_ENDPOINT
                  value: "http://100.64.0.5:9000"
                - name: RUSTFS_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: flk-law-crawl-credentials, key: rustfs-access-key}}
                - name: RUSTFS_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: flk-law-crawl-credentials, key: rustfs-secret-key}}
                - name: LAWS_EXPORT_BUCKET
                  value: "laws-export"
                - name: EMBED_API_KEY
                  valueFrom: {secretKeyRef: {name: flk-embed-credentials, key: embed-api-key}}
                - name: EMBED_MODEL
                  value: "Qwen/Qwen3-Embedding-0.6B"
                - name: QDRANT_URL
                  value: "http://100.64.0.9:6333"
                - name: QDRANT_COLLECTION
                  value: "law_chunks_v2"
              command: ["node", "bin/flk-embed.mjs"]
